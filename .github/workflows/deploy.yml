name: Validate and publish Astro

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.MD'
      - 'AGENTS.md'
      - 'PRODUCT.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.MD'
      - 'AGENTS.md'
      - 'PRODUCT.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('blog-pr-{0}', github.event.pull_request.number) || 'blog-production-master' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Astro source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache generated font subsets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .astro/reading-font-cache
          key: reading-fonts-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/optimize-fonts.mjs') }}-${{ github.sha }}
          restore-keys: |
            reading-fonts-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/optimize-fonts.mjs') }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, typecheck and test
        run: pnpm format:check && pnpm check && pnpm test

      - name: Build static site
        run: pnpm build

      - name: Verify routes, content and font outlines
        run: pnpm verify

      - name: Retain verified static artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout publication script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified static artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-${{ github.sha }}
          path: dist/

      - name: Checkout current static publication
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          path: release

      - name: Publish static artifacts without rewriting history
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          latest=$(git -C release ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_SHA" ]; then
            git -C release fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$latest"
            if ! git -C release diff --quiet "$SOURCE_SHA" "$latest" -- . ':!docs' ':!README.MD' ':!AGENTS.md' ':!PRODUCT.md'; then
              echo 'Newer source changes exist; their queued workflow will publish.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo 'Only documentation changed since this build; publishing the verified artifacts.' >> "$GITHUB_STEP_SUMMARY"
          fi
          source_author=$(git show -s --format='%an <%ae>' "$SOURCE_SHA")
          node scripts/sync-static.mjs dist release
          if git -C release diff --cached --quiet; then
            echo 'Static artifacts are unchanged; no deployment commit needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C release config user.name 'github-actions[bot]'
          git -C release config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release commit --author "$source_author" -m "Deploy Astro from source $SOURCE_SHA"
          git -C release push origin HEAD:master
          published=$(git -C release rev-parse HEAD)
          echo "Published source $SOURCE_SHA as master $published. Vercel deployment is verified separately." >> "$GITHUB_STEP_SUMMARY"
