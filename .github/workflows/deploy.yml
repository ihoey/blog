name: Deploy Astro to master

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.MD'
      - 'AGENTS.md'
      - 'PRODUCT.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-production-master
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Astro source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache generated font subsets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .astro/reading-font-cache
          key: reading-fonts-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/optimize-fonts.mjs') }}-${{ github.sha }}
          restore-keys: |
            reading-fonts-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/optimize-fonts.mjs') }}-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm check && pnpm test

      - name: Build and verify static site
        run: pnpm build && pnpm verify

      - name: Checkout current static publication
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          path: release

      - name: Publish static artifacts without rewriting history
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          latest=$(git -C release ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_SHA" ]; then
            echo 'A newer main commit exists; its queued workflow will publish.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          source_author=$(git show -s --format='%an <%ae>' "$SOURCE_SHA")
          node scripts/sync-static.mjs dist release
          if git -C release diff --cached --quiet; then
            echo 'Static artifacts are unchanged; no deployment commit needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -C release config user.name 'github-actions[bot]'
          git -C release config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C release commit --author "$source_author" -m "Deploy Astro from source $SOURCE_SHA"
          git -C release push origin HEAD:master
          published=$(git -C release rev-parse HEAD)
          echo "Published source $SOURCE_SHA as master $published. Vercel deployment is verified separately." >> "$GITHUB_STEP_SUMMARY"

      # One-time cleanup for this branch migration; future pushes do not run it.
      - name: Remove verified duplicate and merged branches
        if: github.event_name == 'push' && github.event.before == 'd412f606b45dc2c4b2fbf5ba7f56ba83a19e9dd6'
        run: |
          while read -r branch expected; do
            current=$(git -C release ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [ -z "$current" ]; then continue; fi
            if [ "$current" != "$expected" ]; then
              echo "::notice::Keeping $branch because its head changed after review."
              continue
            fi
            git -C release push origin --delete "$branch"
          done <<'BRANCHES'
          feat/astro-migration d412f606b45dc2c4b2fbf5ba7f56ba83a19e9dd6
          next 57828763b8ef90ba74ad837cc42cbfa0c88e1530
          add-license-1 2d93dd8e01af7e9692d5e0c082770d0763375dc7
          add-code-of-conduct-1 1b165aef54d57f32b55d6696db42af87532121fb
          BRANCHES
